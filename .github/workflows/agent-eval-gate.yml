# CI eval gate for the platform docs assistant.
#
# On every push and pull request, run the offline LangSmith experiment
# (openevals correctness + fairness LLM-as-judge, plus a code check) against the
# golden dataset, and FAIL the check if any mean score drops below
# config.CI_THRESHOLDS. Which agent version ships is the one-line repo-root
# AGENT_VERSION file — flip it to v2 and push to watch the gate fail.
#
# Required repository secrets:
#   LANGSMITH_API_KEY   — workspace-scoped key (experiments land in that workspace)
#   OPENAI_API_KEY      — or the key for whichever provider MODEL / JUDGE_MODEL use
# Optional repository variables: MODEL, JUDGE_MODEL, LANGSMITH_ENDPOINT
name: Agent eval gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      agent_version:
        description: "Agent version to evaluate (blank = AGENT_VERSION file)"
        required: false
        default: ""

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: pov-docs-assistant-ci
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ vars.MODEL || 'openai:gpt-5.4-nano' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'openai:gpt-5.4-mini' }}
      USE_LANGSMITH_GATEWAY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Offline self-checks (no API calls)
        run: |
          uv run python -m pov_agent.tools
          uv run python -m pov_agent.langsmith.evaluators

      - name: Eval gate (LangSmith experiment + thresholds)
        env:
          # Empty on push / PR, so the AGENT_VERSION file decides.
          AGENT_VERSION: ${{ github.event.inputs.agent_version }}
        run: uv run pov-eval-gate
